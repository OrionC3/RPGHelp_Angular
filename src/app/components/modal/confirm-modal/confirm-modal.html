<div class="modal-backdrop" (click)="onCancel()"></div>
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-footer">
      <span>{{ message() }}</span>
      <button (click)="onConfirm()">Confirmer</button>
      <button (click)="onCancel()">Annuler</button>
    </div>
  </div>
</div>
