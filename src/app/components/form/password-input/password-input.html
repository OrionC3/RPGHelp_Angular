<input
  [id]="inpuId()"
  [type]="showPassword ? 'text' : 'password'"
  [value]="value"
  [disabled]="disabled"
  (input)="handleInput($event)"
  (blur)="onTouched()"
/>
<button type="button" (click)="togglePasswordVisibility()">  {{ showPassword ? ('components.common.form.password-input-hiden' | translate): ('components.common.form.password-input-show' | translate)}}</button>
