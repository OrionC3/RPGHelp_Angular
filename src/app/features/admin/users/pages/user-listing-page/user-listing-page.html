<h2>
    {{
        'common.list-element'
            | translate: { element: ('common.users' | translate) }
    }}
</h2>

<app-pagination
    [total]="count"
    [(currentPage)]="currentPage"
    (futurPage)="futurPage($event)"
    [pageSize]="pageSize"
/>

<app-listing-table-admin
    [elements]="user"
    [colums]="userColumns"
    (clickDetails)="onClickDetails($event)"
    (clickDelete)="onClickDelete($event)"
    [elementNameKey]="'email'"
/>
