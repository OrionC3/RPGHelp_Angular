<h2>{{ 'features.campaign.pages.campaign-listing-page.title' | translate }}</h2>
@for (item of campaign; track $index) {
    <p>
        {{ item.name }}
        <a [routerLink]="['/campaign', item.id]">{{
            'common.details' | translate
        }}</a>
    </p>
}
<br />
<a [routerLink]="['/campaign', 'add']">{{ 'common.create' | translate }}</a>
